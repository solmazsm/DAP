
name: Track Forks
on:
  fork:
    types: [created]

jobs:
  log-fork:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allows git push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log new fork
        run: |
          echo "New fork created by: ${{ github.actor }}" >> fork_log.txt
          echo "Repo URL: https://github.com/${{ github.actor }}/${{ github.event.repository.name }}" >> fork_log.txt
          echo "Date: $(date)" >> fork_log.txt
          echo "-----------------------------------" >> fork_log.txt

      - name: Commit log
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add fork_log.txt
          git commit -m "Log new fork by ${{ github.actor }}" || echo "No changes to commit"
          git push

